<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>Clone Device - Remote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">CLONE<span>DEVICE</span></div>
  <div class="status" id="status">
    <i class="dot"></i><span id="statusText">Terputus</span>
  </div>
  <div class="stats">
    <span id="fps">0 fps</span>
    <span id="ping">- ms</span>
  </div>
  <button class="icon-btn" id="btnSettings" title="Pengaturan">&#9881;</button>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="screen">Layar</button>
  <button class="tab" data-tab="files">Berkas</button>
</nav>

<!-- ============ TAB LAYAR ============ -->
<section class="pane active" id="pane-screen">
  <div class="screen-wrap" id="screenWrap">
    <div class="screen" id="screen">
      <img id="frame" alt="layar device">
      <div class="overlay" id="overlay"></div>
      <div class="placeholder" id="placeholder">
        <div class="spinner"></div>
        <p>Menyambung ke device...</p>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button class="tbtn" data-key="HOME">&#8962; Home</button>
    <button class="tbtn" data-key="BACK">&#8592; Back</button>
    <button class="tbtn" data-key="RECENTS">&#9633; Recents</button>
    <button class="tbtn" data-key="NOTIF">&#9776; Notif</button>
    <button class="tbtn" data-key="POWER_MENU">&#9211; Daya</button>
    <button class="tbtn" id="btnFull">&#9974; Layar</button>
  </div>

  <div class="keyboard">
    <input type="text" id="txtInput" placeholder="Ketik teks lalu kirim ke device..." autocomplete="off">
    <button class="tbtn accent" id="btnSendText">Kirim</button>
  </div>

  <p class="hint">Ketuk layar untuk tap &middot; geser untuk swipe &middot; tombol di atas kirim perintah navigasi.</p>
</section>

<!-- ============ TAB BERKAS ============ -->
<section class="pane" id="pane-files">
  <div class="crumbs" id="crumbs"></div>
  <div class="file-actions">
    <button class="tbtn" id="btnUp">&#8593; Naik</button>
    <button class="tbtn" id="btnRefresh">&#8635; Muat ulang</button>
    <label class="tbtn" for="fileInput">&#43; Unggah</label>
    <input type="file" id="fileInput" hidden>
  </div>
  <ul class="filelist" id="fileList"></ul>
  <p class="hint" id="fileHint">File device akan tampil di sini.</p>
</section>

<!-- ============ PENGATURAN ============ -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<aside class="sheet" id="sheet">
  <h3>Pengaturan</h3>
  <label>Alamat server / device
    <input type="text" id="setHost" placeholder="192.168.1.5" inputmode="text">
  </label>
  <label>Port
    <input type="number" id="setPort" inputmode="numeric" value="8080">
  </label>
  <label class="row">
    <input type="checkbox" id="setAuto"> Sambung ulang otomatis
  </label>
  <label class="row">
    <input type="checkbox" id="setFullQuality"> Kirim frame kualitas penuh
  </label>
  <div class="sheet-actions">
    <button class="tbtn" id="btnReset">Reset</button>
    <button class="tbtn accent" id="btnApply">Terapkan &amp; Sambung</button>
  </div>
  <div class="sheet-info" id="sheetInfo"></div>
</aside>

<div class="toast" id="toast"></div>

<script src="protocol.js"></script>
<script src="app.js"></script>
</body>
</html>
